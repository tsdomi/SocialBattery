<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Battery - Kereső demó</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg-dark:#0d0f14; --bg-darker:#08090c; --accent:#7c5cff; --accent-2:#ff5cad;
    --text-light:#f5f6fa; --text-muted:#a7abbd; --nav-bg:#16181f;
  }
  html,body { height:100%; font-family:'Poppins',sans-serif; background:var(--bg-dark); color:var(--text-light); }
  body {
    background: radial-gradient(circle at 20% 20%, rgba(124,92,255,0.15), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(255,92,173,0.12), transparent 45%),
                var(--bg-dark);
    min-height:100vh; padding:60px 4vw;
  }
  h1 { font-size:2rem; margin-bottom:24px; background:linear-gradient(135deg,#fff 30%,#c9bfff 70%,var(--accent-2) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .search-wrap { max-width:480px; margin-bottom:32px; position:relative; }
  #searchInput {
    width:100%; padding:14px 20px; border-radius:999px; border:1px solid rgba(255,255,255,0.12);
    background:var(--nav-bg); color:var(--text-light); font-family:inherit; font-size:1rem; outline:none;
    transition:border-color .25s ease;
  }
  #searchInput:focus { border-color:var(--accent); box-shadow:0 0 20px rgba(124,92,255,0.35); }

  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px;
  }

  .card {
    background:var(--nav-bg);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:transform .25s ease, box-shadow .25s ease;
    cursor:pointer;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(124,92,255,0.25); }

  .card img { width:100%; height:130px; object-fit:cover; display:block; background:#1c1e27; }

  .card-body { padding:14px 16px; }
  .card-title { font-weight:600; font-size:0.95rem; margin-bottom:4px; }
  .card-sub { font-size:0.8rem; color:var(--text-muted); }

  /* Skeleton loading state */
  .skeleton { background:linear-gradient(90deg, #1c1e27 25%, #262936 37%, #1c1e27 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
  .skeleton .card-title, .skeleton .card-sub { height:12px; border-radius:6px; background:rgba(255,255,255,0.08); color:transparent; }
  .skeleton img { background:#1c1e27; }
  @keyframes shimmer { 0% { background-position:100% 0; } 100% { background-position:0 0; } }

  .empty-state { color:var(--text-muted); font-size:0.95rem; padding:40px 0; text-align:center; grid-column:1/-1; }
</style>
</head>
<body>

<h1>Események keresése</h1>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Keress esemény, hely, kulcsszó szerint...">
</div>

<div class="grid" id="grid"></div>

<script>
/* ============================================================
   1) SZERVER SZIMULÁCIÓ (éles rendszerben ez egy valós fetch('/api/events?q=...') lenne)
   A kép URL-eket cache-elhetnéd/statikusan tarthatnád, a szöveget
   mindig friss válaszból veszed.
   ============================================================ */
const FAKE_DB = [
  { id:1, img:'https://picsum.photos/seed/1/300/200', title:'Kávézós beszélgetés', subtitle:'Budapest • 24 fő jelentkezett' },
  { id:2, img:'https://picsum.photos/seed/2/300/200', title:'Társasjáték est', subtitle:'Székesfehérvár • 12 fő jelentkezett' },
  { id:3, img:'https://picsum.photos/seed/3/300/200', title:'Robotika workshop', subtitle:'Online • 40 fő jelentkezett' },
  { id:4, img:'https://picsum.photos/seed/4/300/200', title:'Kirándulás a hegyekbe', subtitle:'Balaton-felvidék • 8 fő' },
  { id:5, img:'https://picsum.photos/seed/5/300/200', title:'Filmklub: sci-fi est', subtitle:'Budapest • 30 fő jelentkezett' },
  { id:6, img:'https://picsum.photos/seed/6/300/200', title:'Programozói meetup', subtitle:'Online • 55 fő jelentkezett' },
];

function fakeServerSearch(query, signal) {
  return new Promise((resolve, reject) => {
    const delay = 400 + Math.random() * 300;
    const timer = setTimeout(() => {
      const q = query.trim().toLowerCase();
      const results = q.length === 0
        ? FAKE_DB
        : FAKE_DB.filter(item => item.title.toLowerCase().includes(q) || item.subtitle.toLowerCase().includes(q));
      resolve(results);
    }, delay);
    signal.addEventListener('abort', () => { clearTimeout(timer); reject(new DOMException('Aborted', 'AbortError')); });
  });
}

/* ÉLES VÁLTOZATBAN EZT HASZNÁLNÁD A FENTI HELYETT:
async function realServerSearch(query, signal) {
  const res = await fetch(`/api/events?q=${encodeURIComponent(query)}`, { signal });
  if (!res.ok) throw new Error('Szerver hiba: ' + res.status);
  return res.json(); // [{id, img, title, subtitle}, ...]
}
*/

/* ============================================================
   2) RENDERELÉS
   ============================================================ */
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');

function renderSkeletons(count = 6) {
  grid.innerHTML = Array.from({ length: count }).map(() => `
    <div class="card skeleton">
      <img>
      <div class="card-body">
        <div class="card-title">placeholder</div>
        <div class="card-sub">placeholder</div>
      </div>
    </div>
  `).join('');
}

function renderCards(items) {
  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-state">Nincs találat.</div>';
    return;
  }
  grid.innerHTML = items.map(item => `
    <div class="card" data-id="${item.id}">
      <img src="${item.img}" alt="${item.title}" loading="lazy">
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-sub">${item.subtitle}</div>
      </div>
    </div>
  `).join('');
}

/* ============================================================
   3) DEBOUNCE + ABORT + VERSENYHELYZET KEZELÉS
   ============================================================ */
let debounceTimer = null;
let activeController = null;

function debouncedSearch(query) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => runSearch(query), 300);
}

async function runSearch(query) {
  if (activeController) activeController.abort();
  activeController = new AbortController();
  const { signal } = activeController;

  renderSkeletons();

  try {
    const results = await fakeServerSearch(query, signal);
    renderCards(results);
  } catch (err) {
    if (err.name !== 'AbortError') {
      grid.innerHTML = '<div class="empty-state">Hiba történt a keresés közben.</div>';
      console.error(err);
    }
  }
}

searchInput.addEventListener('input', (e) => debouncedSearch(e.target.value));

// kezdeti betöltés
runSearch('');
</script>

</body>
</html>
